<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     role="img"
     aria-label="SIDM research thread: finished and ongoing work only (future directions removed).">
  <style>
    .rm-edge { fill: none; stroke: #969aa2; stroke-width: 2.6; }
    .rm-edge-label { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace; fill: #8f0a1f; }
    .rm-node rect { fill: #f8e3e7; stroke: #8f0a1f; stroke-width: 2.5; }
    .rm-node text { fill: #1c1f24; font-weight: 600; }
    .rm-node .rm-meta { font-weight: 400; fill: #1a56db; letter-spacing: .02em; }
    .rm-node--dashed rect { fill: #f8e3e7; stroke: #8f0a1f; stroke-width: 2.5; stroke-dasharray: 6 5; }
    .rm-node--dashed text { fill: #55606e; font-weight: 500; }
  </style>

  <g transform="scale(0.85)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#969aa2"></path>
      </marker>
    </defs>

    <!-- Stem exits the right edge of box 1, then fans into 3 branches. -->
    <path class="rm-edge" d="M 316 286 L 380 286"></path>
    <path class="rm-edge" d="M 380 286 L 380 84 L 800 84" marker-end="url(#arrow)"></path>
    <path class="rm-edge" d="M 380 286 L 800 286" marker-end="url(#arrow)"></path>
    <path class="rm-edge" d="M 380 286 L 380 436 L 800 436" marker-end="url(#arrow)"></path>

    <!-- Top link (tidal-track / 2412) -->
    <text class="rm-edge-label" x="395" y="74" text-anchor="start">
      <tspan font-size="26" font-weight="700" fill="#ba0c2f">+</tspan><tspan font-size="17" dx="6">star particles,</tspan>
    </text>
    <text class="rm-edge-label" x="425" y="102" text-anchor="start" font-size="17">tidal evolutionary tracks</text>

    <!-- Middle link (population / 2310) -->
    <text class="rm-edge-label" x="395" y="276" text-anchor="start">
      <tspan font-size="26" font-weight="700" fill="#ba0c2f">+</tspan><tspan font-size="17" dx="6">merger history to make</tspan>
    </text>
    <text class="rm-edge-label" x="425" y="304" text-anchor="start" font-size="17">a population</text>

    <!-- Bottom link (post-core-collapse BH / 2608) -->
    <text class="rm-edge-label" x="395" y="426" text-anchor="start">
      <tspan font-size="26" font-weight="700" fill="#ba0c2f">+</tspan><tspan font-size="17" dx="6">post-core-collapse BH</tspan>
    </text>

    <!-- Tagging side-question forking downward from the top (2412) line. -->
    <path class="rm-edge" d="M 700 84 L 700 150" marker-end="url(#arrow)"></path>
    <text class="rm-edge-label" x="712" y="136" text-anchor="start">
      <tspan font-size="22" font-weight="700" fill="#ba0c2f">+</tspan><tspan font-size="16" dx="4">tagging method</tspan>
    </text>
    <g class="rm-node--dashed">
      <rect x="555" y="150" width="290" height="92" rx="12"></rect>
      <text x="700" y="172" text-anchor="middle" font-size="18">tagging DM particles as stars:</text>
      <text x="700" y="196" text-anchor="middle" font-size="18">does it work for SIDM?</text>
      <text x="700" y="220" text-anchor="middle" font-size="18">a better tagging method?</text>
    </g>

    <!-- 1 -->
    <g class="rm-node">
      <rect x="16" y="250" width="300" height="72" rx="12"></rect>
      <text x="166" y="274" text-anchor="middle" font-size="20">Evolution:</text>
      <text x="166" y="296" text-anchor="middle" font-size="20">a single SIDM (sub)halo</text>
      <text class="rm-meta" x="166" y="314" text-anchor="middle" font-size="14">arXiv:2110.00259</text>
    </g>

    <!-- Halt side-question below the single-subhalo block. -->
    <path class="rm-edge" d="M 166 322 L 166 408" marker-end="url(#arrow)"></path>
    <g class="rm-node--dashed">
      <rect x="16" y="408" width="300" height="68" rx="12"></rect>
      <text x="166" y="434" text-anchor="middle" font-size="18">Can core-collapse halt itself</text>
      <text x="166" y="458" text-anchor="middle" font-size="18">with v-dependent models?</text>
    </g>

    <!-- 3 (top branch): stellar dynamical response to SIDM core & core-collapse -->
    <g class="rm-node">
      <rect x="800" y="48" width="390" height="72" rx="12"></rect>
      <text x="995" y="72" text-anchor="middle" font-size="20">stellar dynamical response to SIDM</text>
      <text x="995" y="94" text-anchor="middle" font-size="20">core and core-collapse</text>
      <text class="rm-meta" x="995" y="112" text-anchor="middle" font-size="14">arXiv:2412.14621</text>
    </g>

    <!-- 2 (second branch): a population of SIDM subhalos -->
    <g class="rm-node">
      <rect x="800" y="250" width="390" height="72" rx="12"></rect>
      <text x="995" y="274" text-anchor="middle" font-size="20">Evolution:</text>
      <text x="995" y="296" text-anchor="middle" font-size="20">a population of SIDM subhalos</text>
      <text class="rm-meta" x="995" y="314" text-anchor="middle" font-size="14">arXiv:2310.09910</text>
    </g>

    <!-- 5: post-core-collapse co-evolution -->
    <g class="rm-node">
      <rect x="800" y="400" width="390" height="72" rx="12"></rect>
      <text x="995" y="424" text-anchor="middle" font-size="20">post-core-collapse co-evolution:</text>
      <text x="995" y="446" text-anchor="middle" font-size="20">halo and SIDM-seeded black hole</text>
      <text class="rm-meta" x="995" y="464" text-anchor="middle" font-size="14">arXiv:2608.xxxxx</text>
    </g>

    <!-- 4: separate finished line (LG past pericenter) -->
    <g class="rm-node">
      <rect x="16" y="702" width="520" height="52" rx="12"></rect>
      <text x="276" y="724" text-anchor="middle" font-size="19">SIDM &amp; possible Local Group past pericenter</text>
      <text class="rm-meta" x="276" y="744" text-anchor="middle" font-size="14">arXiv:2604.08647</text>
    </g>
  </g>
</svg>
